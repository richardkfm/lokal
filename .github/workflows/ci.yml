name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The Prisma client is generated, not committed; postinstall creates it.
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "file:./ci.db"

      # Format, lint, typecheck and tests. The lint step carries the
      # architectural boundaries (pure engine, no currency in output), so a
      # violation fails the build rather than sliding through review.
      - run: pnpm run check
        env:
          DATABASE_URL: "file:./ci.db"

      - run: pnpm run build
        env:
          DATABASE_URL: "file:./ci.db"
          NEXT_TELEMETRY_DISABLED: 1
